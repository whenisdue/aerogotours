    <text x="650" y="594" fill="#596875" font-size="15">No confirmed start date in sources checked 27 Oct 2026.</text>
    <path d="M1057 531v68m-25-53 25-25 25 25m-50 53h50" fill="none" stroke="#d84869" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="76" y="704" fill="#596875" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.2">CHECK YOUR NATIONALITY, DESTINATION AND CURRENT OFFICIAL RULES BEFORE YOU TRAVEL</text>
</svg>
