<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Historical Taiwan flight cancellations — October 23, 2026; sources rechecked October 24</title>
  <desc id="desc">Historical October 23 totals reported by Reuters and four Singapore Airlines services cancelled that day. The graphic is checked October 24 and is not an October 24 total, a storm photograph, or a depiction of an affected aircraft.</desc>
  <rect width="1440" height="720" fill="#f2efe9"/>
  <path d="M0 0h20v720H0z" fill="#d65b3b"/>
  <text x="96" y="88" fill="#b94c32" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">AEROGO / TRAVEL NEWS</text>
  <text x="96" y="158" fill="#18343b" font-family="Georgia, serif" font-size="54">Typhoon Champi</text>
  <text x="96" y="218" fill="#18343b" font-family="Georgia, serif" font-size="54">Taiwan flight advisory</text>
  <text x="96" y="272" fill="#52636a" font-family="Arial, sans-serif" font-size="27" letter-spacing="1.5">CHECKED 24 OCTOBER · HISTORICAL FIGURES BELOW ARE FOR 23 OCTOBER</text>
  <rect x="96" y="326" width="596" height="268" rx="8" fill="#18343b"/>
  <text x="132" y="380" fill="#f4b06a" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2">TAIWAN / FRIDAY 23 OCTOBER</text>
  <text x="132" y="448" fill="#ffffff" font-family="Georgia, serif" font-size="43">262 domestic</text>
  <text x="132" y="494" fill="#ffffff" font-family="Arial, sans-serif" font-size="38">&gt;350 international</text>
  <text x="132" y="531" fill="#cbd8d8" font-family="Arial, sans-serif" font-size="24">Reuters report, citing Taiwan’s ministry;</text>
  <text x="132" y="562" fill="#cbd8d8" font-family="Arial, sans-serif" font-size="24">figures are for Oct 23, not Oct 24.</text>
  <rect x="724" y="326" width="620" height="268" rx="8" fill="#ffffff" stroke="#d5d8d3" stroke-width="2"/>
  <text x="760" y="380" fill="#b94c32" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="2">SINGAPORE AIRLINES / 23 OCT</text>
  <text x="760" y="439" fill="#18343b" font-family="Arial, sans-serif" font-size="37" font-weight="700">SQ876 · SQ878</text>
  <text x="760" y="472" fill="#52636a" font-family="Arial, sans-serif" font-size="25">Singapore → Taipei</text>
  <text x="760" y="519" fill="#18343b" font-family="Arial, sans-serif" font-size="37" font-weight="700">SQ877 · SQ879</text>
  <text x="760" y="552" fill="#52636a" font-family="Arial, sans-serif" font-size="25">Taipei → Singapore</text>
  <text x="96" y="657" fill="#18343b" font-family="Arial, sans-serif" font-size="25" font-weight="700">Manila–Taipei: no blanket cancellation established. Check your carrier.</text>
</svg>
